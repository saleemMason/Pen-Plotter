<!DOCTYPE html>

<html lang="en">

<head>
    
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
    
    <style>
        @font-face{
            font-family: "MyHand";
            src: url("Myfont-Regular.ttf");
        }

        :root {
            --s:0.5;
        }
        
        body {
            background: #ddd;
            margin: 0;
            padding: 20px;
            font-family: system-ui, sans-serif;
        }

        .layout {
            display: flex;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 60vw;
        }

        .controls .row {
            display: flex;
            gap: 8px;
            align-items:center;
            flex-wrap: wrap;
        }

        textarea {
            width: 320px;
            height: 220px;
            min-width: 180px;
            min-height: 100px;
            max-width: 60vw;
            box-sizing: border-box;
            font-size: 16px;
            padding: 8px;
            resize: both;
        }

        input[type="number"] { width: 60px; }

        .a4 {
            position: relative;
            flex: 0 0 auto;
            width: calc(210mm * var(--s));
            height: calc(297mm * var(--s));
            background: white;
            box-shadow: 0 0 0 1px #333;
            overflow: hidden;
        }

        .a4 iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .tb {
            position: absolute;
            box-sizing: border-box;
            border: 2px dotted rgba(37, 99, 235, 0.55);
            cursor: move;
            touch-action: none;
            user-select: none;
            z-index: 1;
        }

        .tb.selected { border-color:#2563eb; z-index:2;}

        .tb .txt {
            font-family: "MyHand", cursive;
            white-space: pre-wrap;
            pointer-events: none;
            overflow: visible;
            font-family: "MyHand", cursive;
            letter-spacing: random(-0.3mm, -0.35mm);
        }

        .handle {
            display: none;
            position: absolute;
            background: #2563eb;
            touch-action: none;
        }

        .tb.selected .handle { display: block; }

        .handle.resize {
            right: -8px; bottom: -8px;
            width: 14px; height: 14px;
            border-radius: 3px;
            cursor: nwse-resize;
        }

        .handle.rotate {
            left: 50%; top: -30px;
            width: 14px; height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            cursor: grab;
        }

        .handle.rotate::after {
            content: "";
            position: absolute;
            left: 50%; top: 100%;
            height: 16px;
            border-left: 2px dotted #2563eb;
        }

        body.hide-frames .tb {border-color:transparent;}
        body.hide-frames .handle {display:none !important;}

        #overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #overlay polyline {
            fill: none;
            stroke: #e11d48;
            stroke-width: 0.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        details { max-width: 320px; }
        details.row { margin-top: 6px;}
        input[type="text"] { width: 150px; }
        #status { max-width: 320px; font-size: 14px; white-space: pre-wrap;}
    </style>
</head>
<body>
<div class="layout">
    <div class="controls">
        <input type="file" id="pdfInput" accept="application/pdf">
            
        <div class="row">
            <button id="addBtn">Add a text box</button>
            <button id="delBtn" disabled>Delete the box</button>
        </div>
        
        <details>
            <summary>Plotter settings</summary>
            <div class="row">
                <label>Paper corner X <input type="number" id="paperX" value="0"></label>
                <label>Y<input type="number" id="paperY" value="0"></label>
            </div>

            <div class="row">
                <label>Bed max X <input type="number" id="bedX" value="235"></label>
                <label>Y<input type="number" id="bedY" value="235"></label>
            </div>

            <div class="row">
                <label>Pen up <input type="text" id="penUpCMD" value="G1 Z5 f3000"></label>
            </div>
            <div class="row">
                <label>Pen down <input type="text" id="penDownCmd" value="G1 Z0 F1000"></label>
            </div>
        </details>

        <div class="row">
            <button id="previewBtn">Preview strokes</button>
            <button id="exportBtn">Export G-code</button>
        </div>
        <div id="status"></div>

        </details>
        <textarea id="textInput" placeholder="Add a text box and type your text here..."></textarea>
            
        <div class="row">
            <label>Letter size (mm) <input type="number" id="sizeInput" value="10" min="2" max="60" step="0.5" disabled></label>
            <label><input type="checkbox" id="hideFrames"> Hide frames</label>
        </div>
    </div>

    <div class="a4" id="sheet">
        <iframe id="pdfview"></iframe>
    </div>
</div>    
    <script>
        const sheet = document.getElementById("sheet");
        const pdfInput = document.getElementById("pdfInput");
        const addBtn = document.getElementById("addBtn");
        const pdfView = document.getElementById("pdfview");
        const textInput = document.getElementById("textInput");
        const sizeInput = document.getElementById("sizeInput");
        const delBtn = document.getElementById("delBtn");
        const A4_WIDTH_MM = 210;
        const pxPerMm = () => sheet.clientWidth / A4_WIDTH_MM;
        const boxes = [];
        let selected = null;

        pdfInput.addEventListener("change", () => {
            const file = pdfInput.files[0];
            if (!file) return;
            pdfView.src = URL.createObjectURL(file) + "#toolbar=0&view=FitH";
        });

        function render(b) {
            const el = b.el;
            el.style.left = `calc(${b.x}mm * var(--s))`;
            el.style.top = `calc(${b.y}mm * var(--s))`;
            el.style.width = `calc(${b.w}mm * var(--s))`;
            el.style.height = `calc(${b.h}mm * var(--s))`;
            el.style.transform = `rotate(${b.rot}deg)`;
            b.txt.style.fontSize = `calc(${b.fs}mm * var(--s))`;
            b.txt.style.lineHeight = `calc(${b.fs * 1.6}mm * var(--s))`;
            b.txt.textContent = b.text;
        }

        function select(b) {
            selected = b;
            boxes.forEach(o => o.el.classList.toggle("selected", o === b));
            const on = !!b;
            textInput.disabled = sizeInput.disabled = delBtn.disabled = !on;
            textInput.value = b ? b.text : "";
            sizeInput.value = b ? b.fs : 10;
        }

        function track(e, onMove) {
            const t = e.currentTarget;
            t.setPointerCapture(e.pointerId);
            const up = () => {
                t.removeEventListener("pointermove", onMove);
                t.removeEventListener("pointerup", up);
                t.removeEventListener("pointercancel", up);
            };
            t.addEventListener("pointermove", onMove);
            t.addEventListener("pointerup", up);
            t.addEventListener("pointercancel", up);
        }

        function addBox() {
            const b = { x: 30, y: 25, w: 150, h: 45, rot:0, fs: 10, text:""};

            b.el = document.createElement("div");
            b.el.className = "tb";
            b.txt = document.createElement("div");
            b.txt.className = "txt";
            const rot = document.createElement("div");
            rot.className = "handle rotate";
            const rsz = document.createElement("div");
            rsz.className = "handle resize";
            b.el.append(b.txt, rot, rsz);
            sheet.appendChild(b.el);
            boxes.push(b);

            b.el.addEventListener("pointerdown", e => {
                if (e.target !== b.el) return;
                select(b);
                let lx = e.clientX, ly = e.clientY;
                track(e, ev => {
                    const k = pxPerMm();
                    b.x += (ev.clientX - lx) / k;
                    b.y += (ev.clientY - ly) / k;
                    lx = ev.clientX; ly = ev.clientY;
                    render(b);
                });
            });

            rot.addEventListener("pointerdown", e => {
                e.stopPropagation();
                select(b);
                const r = b.el.getBoundingClientRect();
                const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                track(e, ev => {
                    let deg = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90;
                    if(ev.shiftKey) deg = Math.round(deg / 15) * 15;
                    b.rot = Math.round (deg * 10) / 10;
                    render(b);
                });
            });

            rsz.addEventListener("pointerdown", e => {
                e.stopPropagation();
                select(b);
                const k = pxPerMm();
                const th = b.rot * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
                const x0 = e.clientX, y0 = e.clientY;
                const w0 = b.w, h0 = b.h;
                const cx0 = b.x + w0 / 2, cy0 = b.y + h0 /2;
                track(e, ev => {
                    const dx = (ev.clientX - x0) / k, dy = (ev.clientY - y0) / k;
                    const dw = dx * cos + dy * sin;
                    const dh = -dx * sin + dy * cos;
                    const w = Math.max(10, w0 + dw), h = Math.max(10, h0 + dh);
                    const rw = w - w0, rh = h -h0;
                    const cx = cx0 + (rw / 2) * cos - (rh / 2) * sin;
                    const cy = cy0 + (rw / 2) * sin + (rh / 2) * cos;
                    b.w = w; b.h = h;
                    b.x = cx - w / 2; b.y = cy - h / 2;
                    render(b);
            });
        });

        render(b);
        select(b);
        textInput.focus();
    }

    addBtn.addEventListener("click", addBox);
    
    delBtn.addEventListener("click", () => {
        if (!selected) return;
        selected.el.remove();
        boxes.splice(boxes.indexOf(selected), 1);
        select(null);
    });

    textInput.addEventListener("input", () => {
        if (!selected) return;
        selected.text = textInput.value;
        render(selected);
    });

    sizeInput.addEventListener("input", () => {
        if (!selected) return;
        const v = parseFloat(sizeInput.value);
        if (v > 0) { selected.fs = v; render(selected); }
    });

    document.addEventListener("pointerdown", e => {
        if (!e.target.closest(".tb, .controls")) select(null);
    });

    window.addEventListener("blur", () => {
        if (document.activeElement === pdfView) select(null);
    });
    document.getElementById("hideFrames").addEventListener("change", e => {
        document.body.classList.toggle("hide-frames", e.target.checked);
    });


    </script>
</body>
</html>
